<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StaffHaven – Recruitment Partner for High Growth Companies</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo_transparent.png" />

    <!-- Preconnect to Google Fonts to eliminate DNS lookup delay -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Load only the weights actually used -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Preload the above-the-fold hero image so it's ready immediately -->
    <link
      rel="preload"
      as="image"
      href="/bannerimg2.jpg"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
